name: Container Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: d0ntblink/owl.red-guest-captive-portal

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Out Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build And Test The App
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: owl-red-guest-portal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Test The Nonroot Read-Only Container
        run: |
          docker compose -f .github/compose-test.yml up -d --wait --wait-timeout 60
          curl --fail --silent --show-error http://127.0.0.1:4321/health
          curl --fail --silent --show-error http://127.0.0.1:4321/ | grep -q 'owl.red guest'
          curl --fail --silent --show-error http://127.0.0.1:4321/psyop-cat.png --output /dev/null
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:4321/?auth_get=clear')
          test "$status" = 403

      - name: Remove The Test Container
        if: always()
        run: docker compose -f .github/compose-test.yml down --remove-orphans

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Out Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Require Publishing Token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Configure the DOCKERHUB_TOKEN repository Actions secret before publishing.'
            exit 1
          fi

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log In To Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: d0ntblink
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish The Tested Revision
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true